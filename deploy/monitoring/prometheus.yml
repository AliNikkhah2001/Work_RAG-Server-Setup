global:
  scrape_interval: 15s
scrape_configs:
  - job_name: "vllm"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics
  - job_name: "gpu"
    static_configs:
      - targets: ["host.docker.internal:9101"]
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: "manager"
    static_configs:
      - targets: ["host.docker.internal:9000"]
    metrics_path: /metrics
  - job_name: "litellm"
    authorization:
      type: Bearer
      credentials: sk-litellm-local-dev-change-me
    static_configs:
      - targets: ["host.docker.internal:4000"]
    metrics_path: /metrics
  - job_name: "otel"
    static_configs:
      - targets: ["otel-collector:9091"]
  - job_name: "jaeger"
    static_configs:
      - targets: ["jaeger:14269"]
    metrics_path: /metrics
