global:
  scrape_interval: 15s
scrape_configs:
  - job_name: "vllm"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics
  - job_name: "gpu"
    static_configs:
      - targets: ["host.docker.internal:9101"]
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
