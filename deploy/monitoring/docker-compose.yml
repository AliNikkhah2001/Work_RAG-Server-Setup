name: rag-monitoring
services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus-test
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.external-url=/prometheus"
      - "--web.route-prefix=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-data:/prometheus
    ports:
      - "19090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter-test
    pid: host
    ports:
      - "19100:9100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana-test
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_SERVER_ROOT_URL=http://192.168.96.82:8088/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "13001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: otel-test
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./otel-config.yml:/etc/otel/config.yml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
      - "19092:9091"
    restart: unless-stopped
