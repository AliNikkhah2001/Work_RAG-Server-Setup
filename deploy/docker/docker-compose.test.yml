# Docker Compose — Test (Alt Ports)
# Alt ports: 8500-8512 (zero impact on production)
# Uses pre-built images from local-h200:5000

services:
  kb-test:
    image: local-h200:5000/rag-kb:b1d48b6
    container_name: rag-kb-test
    ports:
      - "8500:8000"
    environment:
      - KB_DB_URL=postgresql+asyncpg://postgres:postgres@host.docker.internal:15432/kb_manager
      - KB_REDIS_URL=redis://host.docker.internal:16379/0
      - KB_REDIS_TTL=600
      - PORT=8000
      - PYTHONPATH=/app:/host-site-packages
    volumes:
      - /splunk-data/v1/Work_RAG-Server-Setup/offline-prep/venv/lib/python3.12/site-packages:/host-site-packages:ro
      - /splunk-data/v1/Work_RAG-Server-Setup/offline-prep/models/huggingface:/models:ro
      - /splunk-data/v1/Work_Credit-RAG_Phase1/data:/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  guardrails-test:
    image: local-h200:5000/rag-guardrails:b1d48b6
    container_name: rag-guardrails-test
    ports:
      - "8501:8200"
    environment:
      - UPSTREAM_LLM_BASE_URL=http://host.docker.internal:8504/v1
      - UPSTREAM_LLM_MODEL=gemma-4-31b
      - GUARDRAILS_HOST=0.0.0.0
      - GUARDRAILS_PORT=8200
      - PORT=8200
      - PYTHONPATH=/app:/host-site-packages
    volumes:
      - /splunk-data/v1/Work_RAG-Server-Setup/offline-prep/venv/lib/python3.12/site-packages:/host-site-packages:ro
      - /splunk-data/v1/Work_Credit-RAG_Phase1/components/guardrails/policies:/app/policies:ro
      - /splunk-data/v1/Work_Credit-RAG_Phase1/components/guardrails/kb:/app/kb:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      manager-test:
        condition: service_healthy

  orchestrator-test:
    image: local-h200:5000/rag-orchestrator:b1d48b6
    container_name: rag-orchestrator-test
    ports:
      - "8502:8100"
    environment:
      - KB_BASE_URL=http://host.docker.internal:8500
      - GUARDRAILS_BASE_URL=http://host.docker.internal:8501
      - LANGFUSE_HOST=http://host.docker.internal:8503
      - PORT=8100
      - PYTHONPATH=/app:/host-site-packages
    volumes:
      - /splunk-data/v1/Work_RAG-Server-Setup/offline-prep/venv/lib/python3.12/site-packages:/host-site-packages:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      kb-test:
        condition: service_healthy
      guardrails-test:
        condition: service_healthy

  tracing-test:
    image: local-h200:5000/rag-tracing:b1d48b6
    container_name: rag-tracing-test
    ports:
      - "8503:3000"
    environment:
      - PORT=3000
      - TRACES_FILE=/tmp/langfuse_traces_test.jsonl
      - PYTHONPATH=/app:/host-site-packages
    volumes:
      - /splunk-data/v1/Work_RAG-Server-Setup/offline-prep/venv/lib/python3.12/site-packages:/host-site-packages:ro
      - /splunk-data/v1/Work_Credit-RAG_Phase1/logs:/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  manager-test:
    image: local-h200:5000/rag-manager:b1d48b6
    container_name: rag-manager-test
    ports:
      - "8504:9000"
    environment:
      - PORT=9000
      - MANAGER_DB_PATH=/data/manager.db
      - PYTHONPATH=/app:/host-site-packages
    volumes:
      - /splunk-data/v1/Work_RAG-Server-Setup/offline-prep/venv/lib/python3.12/site-packages:/host-site-packages:ro
      - /splunk-data/v1/Work_RAG-Server-Setup/data/manager.db:/data/manager.db
      - /splunk-data/v1/Work_RAG-Server-Setup/logs:/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  gemma-test-8085:
    image: local-h200:5000/rag-gemma:b1d48b6
    container_name: rag-gemma-test-8085
    ports:
      - "8505:8080"
    environment:
      - MODEL_PATH=/models/gemma-4-31b.gguf
      - MODEL_ID=gemma-4-31b
      - PORT=8080
      - N_CTX=8192
      - N_GPU_LAYERS=-1
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONPATH=/app:/host-site-packages
      - LD_LIBRARY_PATH=/usr/local/cuda-12.4/lib64:/host-cuda-libs:$LD_LIBRARY_PATH
    volumes:
      - /splunk-data/v1/Work_RAG-Server-Setup/offline-prep/venv/lib/python3.12/site-packages:/host-site-packages:ro
      - /splunk-data/v1/Work_RAG-Server-Setup/offline-prep/models:/models:ro
      - /usr/local/cuda-12.4/lib64:/host-cuda-libs:ro
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

