# Reference compose file for the RAG data plane (vector DBs + Open WebUI).
# Mirrors the currently-running `-test` containers (docker inspect verified 2026-08-15).
# NOT yet applied via compose — existing containers were started individually.

services:
  redis:
    image: redis:7-alpine
    container_name: redis-test
    ports: ["16379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-test
    ports: ["16333:6333", "16334:6334"]

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector-test
    environment:
      POSTGRES_PASSWORD: testpass
    ports: ["15432:5432"]

  milvus:
    image: milvusdb/milvus:latest
    container_name: milvus-test
    environment:
      ETCD_USE_EMBED: "true"
      MINIO_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports: ["19530:19530", "19091:9091"]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: webui-test
    env_file:
      - /root/.config/rag/webui.env
    environment:
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: "user"
      USE_OLLAMA_DOCKER: "false"
      USE_CUDA_DOCKER: "false"
      USE_EMBEDDING_MODEL_DOCKER: sentence-transformers/all-MiniLM-L6-v2
      RAG_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      # Trust X-Forwarded-For from Nginx/WAF so real client IP is logged (fix for VAF/WAF public exposure)
      FORWARDED_ALLOW_IPS: "*"
      ENABLE_FORWARDED_ALLOW_IPS: "true"
      # Wire to the RAG agent (Orchestrator)
      OPENAI_API_BASE_URL: http://host.docker.internal:8100/v1
      OPENAI_API_KEY: sk-local-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - webui-test:/app/backend/data
    ports: ["13000:8080"]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    ports: ["4000:4000"]
    volumes:
      - ../litellm.yaml:/app/config.yaml:ro
    env_file:
      - ../litellm.env
    environment:
      HTTP_PROXY: http://192.168.203.2:3128
      HTTPS_PROXY: http://192.168.203.2:3128
      NO_PROXY: localhost,127.0.0.1,host.docker.internal,redis,qdrant,pgvector,milvus,langfuse,grafana,prometheus,litellm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Authorization: Bearer sk-litellm-local-dev-change-me' http://127.0.0.1:4000/health || wget -qO- http://127.0.0.1:4000/health/liveliness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Triton-optimized champion (B: vLLM-GGUF reuse + A: TRT-LLM engine)
  triton:
    image: nvcr.io/nvidia/tritonserver:24.12-trtllm-python-py3
    container_name: triton-test
    ports: ["8004:8000", "8005:8001", "8006:8002"]
    volumes:
      - ./triton/model_repository:/models:ro
      - ../offline-prep/models/huggingface:/hf:ro
      - ../offline-prep/models/trt_engines:/engines:ro
    command: ["tritonserver", "--model-repository=/models", "--log-verbose=1", "--metrics-port=8002", "--allow-metrics=true"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: unless-stopped

  vllm-gemma-opt:
    image: vllm/vllm-openai:latest
    container_name: vllm-gemma-opt
    ports: ["8104:8000"]
    volumes:
      - ../offline-prep/models/huggingface/bartowski_google_gemma-4-31B-it-GGUF:/models:ro
    command: ["--model", "/models/google_gemma-4-31B-it-Q4_K_M.gguf", "--load-format", "gguf", "--quantization", "gguf", "--host", "0.0.0.0", "--port", "8000", "--gpu-memory-utilization", "0.90", "--max-model-len", "8192", "--enable-prefix-caching"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: unless-stopped

volumes:
  webui-test:
    external: true
